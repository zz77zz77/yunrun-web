<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - 登录</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
<div class="login-card">
  <div class="login-logo">🛡️</div>
  <h1 class="login-title">管理后台</h1>
  <p class="login-sub">请使用管理员账号登录</p>
  <div id="msg" class="msg hidden"></div>
  <div class="form-group">
    <label>用户名</label>
    <input type="text" id="username" placeholder="管理员用户名">
  </div>
  <div class="form-group">
    <label>密码</label>
    <input type="password" id="password" placeholder="管理员密码">
  </div>
  <button class="btn btn-primary btn-block" onclick="doLogin()">登录</button>
</div>
<script>
async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const msgEl = document.getElementById('msg');
  if (!username || !password) { msgEl.textContent = '请填写完整'; msgEl.className = 'msg error'; msgEl.classList.remove('hidden'); return; }
  const res = await fetch('/admin/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ username, password })
  }).then(r => r.json());
  if (res.code === 200) {
    msgEl.textContent = '登录成功，跳转中...'; msgEl.className = 'msg success'; msgEl.classList.remove('hidden');
    setTimeout(() => location.href = '/admin', 600);
  } else {
    msgEl.textContent = res.msg || '登录失败'; msgEl.className = 'msg error'; msgEl.classList.remove('hidden');
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
